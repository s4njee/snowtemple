<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snow four ways</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1220;
        color: #e8eef6;
        font: 16px/1.5 system-ui, sans-serif;
      }
      main {
        padding: 12vh 10vw;
        max-width: 40rem;
      }
      h1 {
        font-size: 3rem;
        margin: 0 0 1rem;
      }
      .snow {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      /* CSS keyframes: one element per flake, transform only, so it runs on the compositor. */
      .css i {
        position: absolute;
        top: -2vh;
        left: 0;
        width: var(--s);
        height: var(--s);
        border-radius: 50%;
        background: #fff;
        opacity: var(--o);
        animation: fall var(--d) linear var(--delay) infinite;
        will-change: transform;
      }
      @keyframes fall {
        from {
          transform: translate3d(var(--x), 0, 0);
        }
        to {
          transform: translate3d(calc(var(--x) + var(--sway)), 104vh, 0);
        }
      }
      /* The same with keyframes of plain values: the compositor can run these on its own. Sway
         is a second, nested element's animation, so neither keyframe reads a custom property. */
      .fixed s {
        position: absolute;
        top: -2vh;
        animation: drop linear infinite;
        will-change: transform;
      }
      .fixed s span {
        display: block;
        border-radius: 50%;
        background: #fff;
        animation: sway ease-in-out infinite alternate;
      }
      @keyframes drop {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(0, 104vh, 0);
        }
      }
      @keyframes sway {
        from {
          transform: translate3d(-12px, 0, 0);
        }
        to {
          transform: translate3d(12px, 0, 0);
        }
      }
      /* Box-shadow snow: one tiny element with a shadow per flake, two copies stacked and slid. */
      .shadow b {
        position: absolute;
        left: 0;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        animation: slide 14s linear infinite;
        will-change: transform;
      }
      @keyframes slide {
        from {
          transform: translate3d(0, -100vh, 0);
        }
        to {
          transform: translate3d(0, 0, 0);
        }
      }
      /* DOM from script, as Snowstorm.js: one element per flake, moved every frame. */
      .dom i {
        position: absolute;
        top: 0;
        left: 0;
        border-radius: 50%;
        background: #fff;
        will-change: transform;
      }
      canvas.snow {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Winter sale</h1>
      <p>
        The page under the snow: some text, so each method is drawn over something a site would
        have. Story 2.5 compares four ways to draw page snow by flake count.
      </p>
    </main>
    <script type="module" src="./snow-compare.ts"></script>
  </body>
</html>
